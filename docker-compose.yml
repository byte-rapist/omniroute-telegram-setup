version: "3.8"

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    ports:
      - "20128:20128"
    volumes:
      - omniroute-data:/app/data
    restart: unless-stopped
    # Uncomment and set if needed
    # environment:
    #   - INITIAL_PASSWORD=changeme

volumes:
  omniroute-data:
